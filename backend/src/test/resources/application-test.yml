spring:
  datasource:
    url: jdbc:h2:mem:gomate;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  data:
    mongodb:
      uri: mongodb://127.0.0.1:27017/gomate_test?serverSelectionTimeoutMS=100&connectTimeoutMS=100&socketTimeoutMS=100
      database: gomate_test
  sql:
    init:
      mode: never
  flyway:
    enabled: true
app:
  firebase:
    enabled: false
  jwt-secret: test-only-secret-32-bytes-long-never-use-in-production
  auth-requests-per-minute: 1000
