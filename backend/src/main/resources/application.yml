server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: gomate-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gomate_auth}
    username: ${DB_USERNAME:gomate}
    password: ${DB_PASSWORD}
  sql:
    init:
      mode: always
  jackson:
    deserialization:
      fail-on-unknown-properties: true
app:
  google-client-ids: ${GOOGLE_CLIENT_IDS:}
  jwt-secret: ${JWT_SECRET}
  issuer: gomate-api
  access-token-seconds: 900
  refresh-token-days: 30
  cors-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
  auth-requests-per-minute: 20
springdoc:
  swagger-ui:
    persist-authorization: false
